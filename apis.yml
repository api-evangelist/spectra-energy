aid: spectra-energy
name: Spectra Energy
description: >-
  Spectra Energy was a Fortune 500 American energy company headquartered in
  Houston, Texas, focused on natural gas transmission and storage, distribution,
  and gathering and processing. Founded in 2007 as a spin-off from Duke Energy,
  Spectra Energy operated the Texas Eastern Pipeline and other major North
  American natural gas infrastructure. In February 2017, Spectra Energy was
  acquired by Enbridge Inc. in an all-stock deal valued at approximately $28
  billion and no longer operates as an independent entity.
